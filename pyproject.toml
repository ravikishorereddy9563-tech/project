[project]
name = "apple-support-agent"
version = "0.1.0"
description = "AppleSupport support agent with retrieval, filtering, and evaluation tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.4,<2",
  "pandas>=2.0,<3",
  "pytest>=8,<9",
  "streamlit>=1.40,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
